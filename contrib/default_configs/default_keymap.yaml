    desc: Sort by UL Speed
  - on: ["s", "r"]
    exec: SortReset
    desc: Reset sort
  - on: "/"
    exec: Search
    desc: Search/Filter
  - on: "p"
    exec: TogglePause
    desc: Pause/Resume
  - on: "f"
    exec: FzfFind
    desc: Find

