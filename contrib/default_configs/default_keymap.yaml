# Default keymap for clashtui
#
# Single key:    on: "j"
# Chord:         on: ["g", "g"]
# Modifier:      on: "<C-u>", on: "<Enter>", on: "<Up>"
# Shift:         on: "G"  (uppercase = shift)
# Flat action:   exec: Edit
# Description:   desc: "Optional description"

global:
  - on: "1"
    exec: GotoStatus
    desc: Go to Status
  - on: "2"
    exec: GotoFile
    desc: Go to File
  - on: "3"
    exec: GotoProxies
    desc: Go to Proxies
  - on: "4"
    exec: GotoConnections
    desc: Go to Connections
  - on: "5"
    exec: GotoLogs
    desc: Go to Logs
  - on: "6"
    exec: GotoSettings
    desc: Go to Settings
  - on: "7"
    exec: GotoService
    desc: Go to Service
  - on: "<Tab>"
    exec: CycleTab
    desc: Cycle tabs
  - on: "?"
    exec: ToggleHelp
    desc: Toggle help
  - on: "q"
    exec: Quit
    desc: Quit
  - on: "<C-c>"
    exec: Quit
    desc: Quit
  - on: ["<C-g>", "c"]
    exec: OpenDataDir
    desc: Open core data dir
  - on: ["<C-g>", "m"]
    exec: OpenInstallDir
    desc: Open core install dir
  - on: ["<C-g>", "f"]
    exec: RestartService
    desc: Start/Restart core service
  - on: ["<C-g>", "t"]
    exec: TerminateAll
    desc: Close all connections

