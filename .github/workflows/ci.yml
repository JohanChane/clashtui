name: CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (e.g. v0.1.0).
          Leave empty for CI-only run.
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CLASHTUI_VERSION: ${{ github.head_ref || '' }}

jobs:
  # ── always: code quality ──────────────────────────────

  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests (debug)
        run: cargo test --locked --all-features

  # ── push to main/dev or tag: build artifacts ──────────

  build:
    name: build (${{ matrix.target }})
    needs: [clippy, test]
    runs-on: ${{ matrix.os }}
    env:
      BUILD_PROFILE: >-
        ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux: zigbuild for glibc 2.17 compatibility ──
          # The default host toolchain links against the runner's
          # glibc.  Older distros (e.g. CentOS 7) ship with glibc
          # 2.17 and cannot upgrade.  `cargo-zigbuild` vendor-links
          # a specified glibc so the binary works everywhere.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            artifact-name: Linux_amd64_Build
            binary-name: clashtui-amd64
            extract-version: true

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            artifact-name: Linux_arm64_Build
            binary-name: clashtui-arm64
            extract-version: false

          # ── macOS: all native runners ──
          # macos-26-intel for x86_64, macos-latest (Apple Silicon)
          # for arm64.  No zig needed — macOS ships its own libc.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact-name: macOS_x86_64_Build
            binary-name: clashtui-darwin-amd64
            extract-version: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: macOS_aarch64_Build
            binary-name: clashtui-darwin-arm64
            extract-version: false

          # ── Windows: all native runners ──
          # windows-latest (x86_64) and windows-11-arm (arm64).
          # MSVC toolchain links the Universal CRT; no glibc concern.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: Windows_amd64_Build
            binary-name: clashtui-windows-amd64.exe
            extract-version: false

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact-name: Windows_arm64_Build
            binary-name: clashtui-windows-arm64.exe
            extract-version: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        if: matrix.zig-target

      - uses: Swatinem/rust-cache@v2

      - name: Download dependencies
        shell: bash
        run: cargo fetch

      - name: Run tests (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo test --release --locked --all-features

      - name: Build (zig)
        if: matrix.zig-target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo install cargo-zigbuild
          cargo zigbuild \
            --target ${{ matrix.zig-target }} \
            ${{ env.BUILD_PROFILE == 'release' && '--release' || '' }} \
            --locked --all-features

      - name: Build (native)
        if: ${{ !matrix.zig-target }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build \
            ${{ env.BUILD_PROFILE == 'release' && '--release' || '' }} \
            --locked \
            --target ${{ matrix.target }} \
            --all-features

      - name: Smoke test
        shell: bash
        run: |
          BIN="./target/${{ matrix.target }}/${BUILD_PROFILE}/clashtui"
          [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
          "$BIN" --version

      - name: Extract version
        if: >-
          matrix.extract-version &&
          startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/clashtui \
            --version | awk '{print $2}' > version.txt

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          SRC="./target/${{ matrix.target }}/${BUILD_PROFILE}/clashtui"
          [ "${{ runner.os }}" = "Windows" ] && SRC="${SRC}.exe"
          mv "$SRC" "./artifacts/${{ matrix.binary-name }}"
          if [ -f version.txt ]; then mv version.txt ./artifacts/version.txt; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts
          retention-days: 7

  # ── tag push or manual release dispatch: publish ──────

  publish:
    name: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.version != '')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ./artifacts

      - name: Get version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RELEASE_VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(cat ./artifacts/version.txt)"
            SEMVER="$(echo "$VERSION" | sed 's/-[0-9a-f]\{7,\}\(-dirty\)\?$//')"
            RELEASE_VERSION="v$SEMVER"
          fi
          TAG_VERSION="${RELEASE_VERSION#v}"
          # Verify Cargo.toml base version matches the tag base version
          if [ -f ./artifacts/version.txt ]; then
            BIN_VERSION="$(cat ./artifacts/version.txt)"
            CARGO_VERSION="$(echo "$BIN_VERSION" \
              | sed 's/-[0-9a-f]\{7,\}\(-dirty\)\?$//')"
            TAG_BASE="${TAG_VERSION%%-*}"
            CARGO_BASE="${CARGO_VERSION%%-*}"
            if [ "$CARGO_BASE" != "$TAG_BASE" ]; then
              echo "Error: Cargo.toml base version ($CARGO_BASE)" \
                "does not match tag base version ($RELEASE_VERSION)"
              echo "Please update Cargo.toml version to" \
                "$TAG_BASE before releasing."
              exit 1
            fi
          fi
          echo "CLASHTUI_RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          # Detect prerelease: version (without 'v' prefix) contains '-'
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "CLASHTUI_IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "CLASHTUI_IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          CHANGELOG=$(gh api \
            "repos/${REPO}/contents/CHANGELOG.md?ref=${REF}" \
            --jq '.content' | base64 -d)
          VERSION="${CLASHTUI_RELEASE_VERSION#v}"
          HEADING=$(echo "$CHANGELOG" | grep "^## \[$VERSION\] " | head -1)
          if [ -z "$HEADING" ]; then
            URL="https://github.com/${{ github.repository }}/blob"
            echo "Please see [CHANGELOG.md]" \
              "(${URL}/${{ github.ref_name }}/CHANGELOG.md)" \
              > release.txt
          else
            HEADING_TEXT="${HEADING#\#\# }"
            ANCHOR=$(echo "$HEADING_TEXT" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[].,;:!?()/' \
              | tr ' ' '-')
            URL="https://github.com/${{ github.repository }}/blob"
            echo "Please see [CHANGELOG-${CLASHTUI_RELEASE_VERSION}]" \
              "(${URL}/${CLASHTUI_RELEASE_VERSION}/CHANGELOG.md#${ANCHOR})" \
              > release.txt
          fi

      - name: Archive release assets
        run: |
          V="${{ env.CLASHTUI_RELEASE_VERSION }}"
          gzip -c ./artifacts/clashtui-amd64 \
            > clashtui-linux-amd64-${V}.gz
          gzip -c ./artifacts/clashtui-arm64 \
            > clashtui-linux-arm64-${V}.gz
          gzip -c ./artifacts/clashtui-darwin-amd64 \
            > clashtui-darwin-amd64-${V}.gz
          gzip -c ./artifacts/clashtui-darwin-arm64 \
            > clashtui-darwin-arm64-${V}.gz
          zip -j clashtui-windows-amd64-${V}.zip \
            ./artifacts/clashtui-windows-amd64.exe
          zip -j clashtui-windows-arm64-${V}.zip \
            ./artifacts/clashtui-windows-arm64.exe

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.CLASHTUI_IS_PRERELEASE == 'true' }}
          body_path: release.txt
          files: |
            clashtui-linux-amd64-${{ env.CLASHTUI_RELEASE_VERSION }}.gz
            clashtui-linux-arm64-${{ env.CLASHTUI_RELEASE_VERSION }}.gz
            clashtui-darwin-amd64-${{ env.CLASHTUI_RELEASE_VERSION }}.gz
            clashtui-darwin-arm64-${{ env.CLASHTUI_RELEASE_VERSION }}.gz
            clashtui-windows-amd64-${{ env.CLASHTUI_RELEASE_VERSION }}.zip
            clashtui-windows-arm64-${{ env.CLASHTUI_RELEASE_VERSION }}.zip
